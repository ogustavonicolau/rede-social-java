<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mini Rede Social</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-4">

    <h1 class="mb-4">Mini Rede Social</h1>

    <div class="card p-3 mb-4">
        <h3>Criar usuário</h3>

        <input id="nome" class="form-control mb-2" placeholder="Nome">
        <input id="email" class="form-control mb-2" placeholder="Email">
        <input id="senha" class="form-control mb-2" placeholder="Senha">

        <button class="btn btn-primary" onclick="criarUsuario()">
            Criar usuário
        </button>
    </div>

    <div class="card p-3 mb-4">
        <h3>Criar postagem</h3>

        <input id="textoPostagem" class="form-control mb-2"
               placeholder="O que você está pensando?">

        <button class="btn btn-success" onclick="criarPostagem()">
            Publicar
        </button>
    </div>

    <h3>Feed</h3>

    <div id="feed"></div>

</div>

<script src="app.js"></script>

</body>
</html>
